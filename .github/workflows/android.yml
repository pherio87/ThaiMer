name: APK Android

# Compila l'app Android (Capacitor) e pubblica l'APK di prova come allegato dell'esecuzione.
# Non tocca Cloudflare Pages: quello pubblica solo la cartella public/ da main.
on:
  push:
    paths:
      - 'public/**'
      - 'android/**'
      - 'capacitor.config.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android.yml'
      # l'APK pubblicato dalla CI stessa non deve far ripartire una compilazione
      - '!public/thaimer.apk'
  workflow_dispatch:
    inputs:
      pubblica:
        description: "Pubblica l'APK firmato su thaimer.pherio.net/download (solo da main, servono i segreti della firma)"
        type: boolean
        default: false

concurrency:
  group: apk-${{ github.ref }}
  # una pubblicazione in corso non va interrotta a metà da un nuovo push
  cancel-in-progress: ${{ inputs.pubblica != true }}

jobs:
  # in parallelo all'APK: il test del loop simula un'ora intera e dura qualche minuto
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # serve solo alla pubblicazione dell'APK su main
    env:
      VERSION_CODE: ${{ github.run_number }}
      PUBBLICA: ${{ inputs.pubblica == true && 'true' || 'false' }}
      HAS_KEY: ${{ secrets.KEYSTORE_B64 != '' }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Controlli prima di pubblicare
        if: env.PUBBLICA == 'true'
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::L'APK si pubblica solo da main."
            exit 1
          fi
          if [ "$HAS_KEY" != "true" ]; then
            echo "::error::Mancano i segreti della firma (KEYSTORE_B64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD): senza una chiave tua l'APK non si potrebbe aggiornare. Vedi il README."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # il runner ha già l'SDK Android; AGP scarica da solo la piattaforma mancante se le licenze sono accettate
      - name: Accetta le licenze dell'SDK
        run: yes | sdkmanager --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci

      - name: Copia la web nel progetto Android
        run: npx cap sync android

      # senza i segreti la compilazione resta quella di prima (chiave di debug)
      - name: Chiave di firma
        if: env.HAS_KEY == 'true'
        run: |
          echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/thaimer.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/thaimer.jks" >> "$GITHUB_ENV"

      - name: Compila l'APK di prova
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Compila il bundle per il Play Store
        if: env.HAS_KEY == 'true'
        working-directory: android
        run: ./gradlew bundleRelease --stacktrace

      - name: Compila l'APK di rilascio
        if: env.PUBBLICA == 'true'
        working-directory: android
        run: ./gradlew assembleRelease --stacktrace

      - name: Pubblica su thaimer.pherio.net
        if: env.PUBBLICA == 'true'
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk public/thaimer.apk
          # mostra con quale certificato è firmato (serve anche per i link che si aprono nell'app)
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$APKSIGNER" ]; then "$APKSIGNER" verify --print-certs public/thaimer.apk; else echo "::warning::apksigner non trovato: firma non verificata"; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/thaimer.apk
          git commit -m "APK per il download (build $GITHUB_RUN_NUMBER)"
          git pull --rebase origin main
          git push origin HEAD:main

      - uses: actions/upload-artifact@v4
        with:
          name: thaimer-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: env.HAS_KEY == 'true'
        with:
          name: thaimer-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
